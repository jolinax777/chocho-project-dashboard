name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch loading guard
        if: github.event_name == 'pull_request'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/App.jsx';
          const source = fs.readFileSync(path, 'utf8');
          const before = `  const loadData = async () => {
            setLoading(true);
            const { result, errors: apiErrors } = await fetchAllData();
            setPayloads(result);
            setErrors(apiErrors);
            setLastLoadedAt(new Date().toLocaleString('zh-TW', { hour12: false }));
            setLoading(false);
          };`.replace(/^ {10}/gm, '');
          const after = `  const loadData = async () => {
            setLoading(true);
            try {
              const { result, errors: apiErrors } = await fetchAllData();
              setPayloads(result);
              setErrors(apiErrors);
              setLastLoadedAt(new Date().toLocaleString('zh-TW', { hour12: false }));
            } catch (error) {
              setErrors([error?.message || '資料載入失敗']);
            } finally {
              setLoading(false);
            }
          };`.replace(/^ {10}/gm, '');
          if (!source.includes(before) && !source.includes(after)) {
            throw new Error('loadData block not found');
          }
          if (source.includes(before)) {
            fs.writeFileSync(path, source.replace(before, after));
          }
          NODE

      - name: Commit generated stability files
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/App.jsx
          git commit -m "fix: improve loading and lockfile stability" || exit 0
          git push

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
